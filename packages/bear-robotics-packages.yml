note: >-
  Bear Robotics publishes no client library to any public package registry (npm, PyPI,
  Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist, crates.io all probed and empty).
  What it does ship is first-party, MPL-2.0 licensed reference client code in its public
  cloud repository, in three languages, each wiring API-key -> JWT authentication plus
  unary and server-streaming gRPC wrappers with retry. Consumers generate the gRPC stubs
  themselves from the published .proto files (see grpc/).
