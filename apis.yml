apis:
- name: Bear Base API
  description: >-
    The on-robot gRPC service for direct local control of a Bear robot, used where the cloud is not in
    the path. 23 RPCs covering drive/twist commands, odometry, battery and robot status, missions, settings
    and errors. It runs on the robot's own PC and is reached over the robot's ethernet port on the local
    network, so it has no public internet endpoint; the documented example channel is insecure (no TLS),
    which is appropriate only on a trusted local link. No OpenAPI is published — Protobuf is the only
    machine-readable contract.
  humanURL: https://base.api.bearrobotics.ai/
  baseURL: http://10.10.127.2:5123
  x-baseurl-note: >-
    This is a private, on-robot address documented by Bear as the robot PC's static ethernet IP and gRPC
    port, not a placeholder and not an internet-reachable host. Recorded verbatim from https://base.api.bearrobotics.ai/guides/setup/setup_network/
    rather than substituted for a public host that does not exist.
  tags:
  - Robotics
  - Robot Control
  - gRPC
  - On-Premise
  properties:
  - type: Protobuf
    url: grpc/robot-v1/bear-robotics-robot-services-robot-api_service.proto
  - type: Documentation
    url: https://base.api.bearrobotics.ai/
