apis:
- name: Bear Cloud API
  description: >-
    The gRPC-first cloud interface for third-party control of Bear Robotics fleets. 39 RPCs — 27
    unary and 12 server-streaming — covering mission creation and workflow, locations and maps,
    localization and navigation, robot and fleet status, system commands, Servi tray operations,
    Carti conveyor operations, and (from v1.3) webhook subscriptions. A REST projection generated
    by google.api.http transcoding exposes 23 of the unary RPCs over JSON; the streaming RPCs
    have no REST equivalent. Authentication is an api_key/secret/scope exchange for a
    short-lived JWT bearer token.
  humanURL: https://cloud.api.bearrobotics.ai/
  baseURL: https://api.bearrobotics.ai
  tags:
  - Robotics
  - Fleet Management
  - Mission Control
  - gRPC
  - Webhooks
  properties:
  - type: OpenAPI
    url: openapi/bear-robotics-cloud-openapi-original.yml
  - type: Postman
    url: openapi/bear-robotics-cloud-v1-3-postman-collection.json
  - type: Protobuf
    url: grpc/v1/bear-robotics-services-cloud-api_service.proto
  - type: Overlay
    url: overlays/bear-robotics-cloud-overlay.yaml
  - type: Documentation
    url: https://cloud.api.bearrobotics.ai/
  - type: APIReference
    url: https://cloud.api.bearrobotics.ai/v1.3/resources/RestAPI/
  - type: GettingStarted
    url: https://cloud.api.bearrobotics.ai/guides/getting-started/
  - type: Authentication
    url: https://cloud.api.bearrobotics.ai/guides/authentication/
  - type: ChangeLog
    url: https://cloud.api.bearrobotics.ai/changelog/v1.3/
  - type: Webhooks
    url: https://cloud.api.bearrobotics.ai/v1.3/resources/Webhooks/
- name: Bear Base API
  description: >-
    The on-robot gRPC service for direct local control of a Bear robot, used where the cloud is
    not in the path. 23 RPCs covering drive/twist commands, odometry, battery and robot status,
    missions, settings and errors. It runs on the robot's own PC and is reached over the robot's
    ethernet port on the local network, so it has no public internet endpoint; the documented
    example channel is insecure (no TLS), which is appropriate only on a trusted local link. No
    OpenAPI is published — Protobuf is the only machine-readable contract.
  humanURL: https://base.api.bearrobotics.ai/
  baseURL: http://10.10.127.2:5123
  x-baseurl-note: >-
    This is a private, on-robot address documented by Bear as the robot PC's static ethernet IP
    and gRPC port, not a placeholder and not an internet-reachable host. Recorded verbatim from
    https://base.api.bearrobotics.ai/guides/setup/setup_network/ rather than substituted for a
    public host that does not exist.
  tags:
  - Robotics
  - Robot Control
  - gRPC
  - On-Premise
  properties:
  - type: Protobuf
    url: grpc/robot-v1/bear-robotics-robot-services-robot-api_service.proto
  - type: Documentation
    url: https://base.api.bearrobotics.ai/
