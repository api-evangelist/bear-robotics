aid: bear-robotics
name: Bear Robotics
description: >-
  Bear Robotics builds AI-driven autonomous mobile robots for hospitality and service
  environments — the Servi family (Servi, Servi Plus, Servi Q, Servi Clean) for restaurants,
  senior living, hotels and hospitals, the Carti cargo line for warehouses and factories, and
  Kinisi — all managed through the Bear Universe cloud fleet platform. Founded in 2017 by former
  Google engineer John Ha, headquartered in Redwood City, California, and now majority-owned by
  LG Electronics. Bear publishes a genuinely open, gRPC-first third-party developer surface: the
  Bear Cloud API (39 RPCs, 27 unary and 12 server-streaming) for creating missions, streaming
  robot state and managing fleets, plus an on-robot Bear Base API for direct local control. The
  Protobuf definitions are published under MPL-2.0 in a public GitHub organization, an
  OpenAPI 3.0.3 document covers the transcoded REST projection, and v1.3 added outbound webhooks.
  API keys are issued through an account manager rather than self-serve signup.
