safety_note: >-
  Any MCP server over this API exposes tools that move physical machines through occupied
  space. RunSystemCommand, ControlConveyor, SetPose, LocalizeRobot and SwitchMap should not be
  exposed to an autonomous agent without human-in-the-loop confirmation. The API offers no
  idempotency key, so a retried write can double-enqueue a mission. See
  agentic-access/bear-robotics-agentic-access.yml.
