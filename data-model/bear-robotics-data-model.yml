polymorphism:
  note: >-
    Mission is a three-level discriminated union and is the hardest part of this contract for
    an agent to fill in correctly. Choose the product family first, then the mission kind.
  Mission:
    BaseMission: [NavigateMission, NavigateAutoMission]
    ServiMission: [NavigateMission, NavigateAutoMission, DeliveryMission, BussingMission, DeliveryPatrolMission, BussingPatrolMission]
    CartiMission: [NavigateMission, NavigateAutoMission, TraverseMission, TraversePatrolMission]
  MissionWorkflow: [ServiWorkflow, CartiWorkflow]
